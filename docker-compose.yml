services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_adminuser_container
    ports:
      - "127.0.0.1:27004:27003"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  service-adminuser:
    build: .
    container_name: service_adminuser
    env_file:
      - .env
    depends_on:
      - mongodb
    ports:
      - "3003:3003"
    restart: unless-stopped

volumes:
  mongo_data: