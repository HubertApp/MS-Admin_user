services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: mongodb_visualizer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      - ME_CONFIG_SITE_PORT=8081
      - PORT=8081
    depends_on:
      - mongodb

  service-adminuser:
    build: .
    container_name: service_adminuser
    env_file:
      - .env
    depends_on:
      - mongodb
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  mongo_data:
