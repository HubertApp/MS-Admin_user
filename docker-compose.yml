services:
  mongodb-adminuser:
    image: mongo:latest
    container_name: mongodb_adminuser_container
    ports:
      - "127.0.0.1:27004:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - hubert-network

  service-adminuser:
    build: .
    container_name: service_adminuser
    labels:
      logging: "enabled"
      service: "service-adminuser"
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://mongodb-adminuser:27017/hubertapp_adminuser
      - OTEL_SERVICE_NAME=service-adminuser
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - mongodb-adminuser
    ports:
      - "3003:3003"
    restart: unless-stopped
    networks:
      - hubert-network

volumes:
  mongo_data:

networks:
  hubert-network:
    external: true