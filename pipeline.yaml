name: "CI — Work branches"

on:
  push:
    branches-ignore:
      - 'main'
      - 'develop'
    paths-ignore:
      - '**.md'

jobs:
  validate:
    name: Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Tests + coverage
        run: make test

      - name: Upload rapport de coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

      - name: Build TypeScript
        run: make build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image Docker
        run: docker build -t ms-admin-user:ci .
